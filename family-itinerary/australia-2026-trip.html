layer=L.layerGroup().addTo(map);

 document.getElementById('c-syd').className=c==='syd'?'on':'';

 renderTabs();render();}

function renderTabs(){
 document.getElementById('tabs').innerHTML=DATA[city].days.map((d,i)=>
  `<button class="${i===day?'on':''}" onclick="selDay(${i})">${d.t}</button>`).join('');
}
function selDay(i){day=i;renderTabs();render();}
function venueDetails(s){
 return `${s.status?`<div class="venue-status">${s.status}</div><br>`:''}${s.d}${s.a?`<br><b>📍 ${s.a}</b><br><small>地址／坐标核对：2026/9/26 · <a href="${s.src}" target="_blank" rel="noopener">店址来源</a> · <a href="${s.geoSource}" target="_blank" rel="noopener">坐标来源</a></small>`:''}`;
}
function highlightSpot(i){
 document.querySelectorAll('#sidebar .item').forEach(el=>el.classList.toggle('selected',Number(el.dataset.spot)===i));
}
function focusSpot(i){
 const marker=spotMarkers.get(i);if(!marker)return;
 highlightSpot(i);map.setView(marker.getLatLng(),Math.max(map.getZoom(),16),{animate:false});marker.openPopup();
}
// Offset only icon/label pixels, never the actual venue coordinates. This also
// keeps nearby venues (including the two Icebergs floors) independently clickable.
function arrangeOptionLabels(){
 if(!optionMarkers.length)return;
 const size=map.getSize(),placed=[],groups=[];
 optionMarkers.forEach(r=>{
  r.p=map.latLngToContainerPoint(r.marker.getLatLng());
  const group=groups.find(g=>g.some(x=>x.p.distanceTo(r.p)<38));
  if(group)group.push(r);else groups.push([r]);
 });
 groups.forEach(g=>g.forEach((r,j)=>{
  const angle=2*Math.PI*j/g.length,dx=g.length>1?Math.round(24*Math.cos(angle)):0,dy=g.length>2?Math.round(24*Math.sin(angle)):0;
  r.display=L.point(r.p.x+dx,r.p.y+dy);
  const icon=r.marker.getIcon();icon.options.iconAnchor=[16-dx,16-dy];r.marker.setIcon(icon);
  if(dx||dy){
   const stem=document.createElement('span');stem.className='label-leader';
   stem.style.cssText=`left:16px;top:16px;width:${Math.hypot(dx,dy)}px;transform:rotate(${Math.atan2(-dy,-dx)}rad)`;
   const anchor=document.createElement('span');anchor.className='venue-anchor';anchor.style.cssText=`left:${16-dx}px;top:${16-dy}px`;
   r.marker.getElement().prepend(stem);r.marker.getElement().append(anchor);
  }
 }));
 const intersects=(a,b)=>a.x<b.x+b.w+4&&a.x+a.w+4>b.x&&a.y<b.y+b.h+4&&a.y+a.h+4>b.y;
 const blocked=optionMarkers.map(r=>({x:r.display.x-20,y:r.display.y-23,w:40,h:43}));
 blocked.push({x:0,y:0,w:45,h:80}); // Leaflet zoom controls
 optionMarkers.forEach(r=>{
  const content=r.label.getElement().querySelector('.label-content');
  const w=140,h=content.offsetHeight,candidates=[];
  for(let y=4;y+h<size.y-20;y+=10)for(let x=4;x+w<size.x-4;x+=10){
   const c={x,y,w,h};
   if(!blocked.some(b=>intersects(c,b))&&!placed.some(b=>intersects(c,b)))candidates.push(c);
  }
  const distance=c=>Math.hypot(c.x+w/2-r.display.x,c.y+h/2-r.display.y);
  candidates.sort((a,b)=>distance(a)-distance(b));
  const pos=candidates[0]||{x:r.display.x-w/2,y:r.display.y-h-25,w,h};placed.push(pos);
  const labelIcon=r.label.getIcon();labelIcon.options.iconAnchor=[r.p.x-pos.x,r.p.y-pos.y];r.label.setIcon(labelIcon);
  // A subtle name callout, not a route between venues.
  const dx=r.display.x-pos.x-w/2,dy=r.display.y-pos.y-h/2;
  const leader=document.createElement('span');leader.className='label-leader';
  leader.style.cssText=`left:${w/2}px;top:${h/2}px;width:${Math.hypot(dx,dy)}px;transform:rotate(${Math.atan2(dy,dx)}rad)`;
  r.label.getElement().prepend(leader);
 });
}
map.on('zoomend moveend resize',arrangeOptionLabels);
function render(){
 const cfg=DATA[city],dd=cfg.days[day],sp=dd.spots,col=DAYC[day%DAYC.length],options=dd.mapMode==='options';
 const geo=sp.filter(s=>Number.isFinite(s.la)&&Number.isFinite(s.lo));
 map.closePopup();layer.clearLayers();spotMarkers.clear();optionMarkers=[];
 let html='',background='';
 if(options)html=`<div class="note map-help"><strong>📍 ${geo.length} 个店址标记 · 仅备选，不是游览路线</strong>点店名可定位并打开详情；切换标签自动显示本组全部点。编号与列表对应，相邻图标会避让，小圆点标真实店址；细线仅为标注引线，并非游览路线。${day===8?' Doyles 原文未明确堂食／外带，两个实际分店均列为待选。':''}${day===9?' ⚠️ Three Blue Ducks Bronte 已闭店，仅标旧址，请勿前往用餐。':''}${day===10?' Opera Bar 室内装修，室外服务出发前再确认。':''}</div>`;
 if(!sp.length){html='<div class="note">这一天还没排内容 —— 想去什么直接告诉我，我加进来。</div>';}
 sp.forEach((s,i)=>{
  const mapped=Number.isFinite(s.la)&&Number.isFinite(s.lo),details=venueDetails(s),number=options?geo.indexOf(s)+1:i+1;
  if(options&&!mapped){background+=`<div class="item"><div><div class="tt">${s.e} ${s.n}</div><div class="dd">${s.d}</div></div></div>`;return;}
  html+=`<div class="item" data-spot="${i}"><div class="num" style="background:${col}">${number}</div><div><div class="tt">${mapped?`<button type="button" class="spot-focus" onclick="focusSpot(${i})" aria-label="在地图查看 ${s.n}">${s.e} ${s.n} <span>📍 定位</span></button>`:`${s.e} ${s.n}`}</div><div class="dd">${details}</div></div></div>`;
  if(!mapped)return;
  const marker=L.marker([s.la,s.lo],{title:s.n,alt:s.n,icon:L.divIcon({className:'',html:`<div class="marker" style="background:${COLORS[s.ty]}">${options?`<span class="marker-number">${number}</span>`:''}${s.e}</div>`,iconSize:[32,32],iconAnchor:[16,16]})})
   .bindPopup(`<b>${s.e} ${s.n}</b><br>${details}`,{maxWidth:280}).addTo(layer);
  marker.on('popupopen',()=>highlightSpot(i));spotMarkers.set(i,marker);
  const label=L.marker([s.la,s.lo],{interactive:false,keyboard:false,icon:L.divIcon({className:`location-label${options?' option-label':''}`,html:`<div class="label-content">${number} ${options?s.e+' ':''}${options?s.label:s.n}</div>`,iconSize:[options?140:150,20],iconAnchor:[75,-18]})}).addTo(layer);
  if(options)optionMarkers.push({marker,label});
 });
 if(background)html+=`<details class="note"><summary>同事原始路线背景（仅备选）</summary>${background}</details>`;
 if(!options&&geo.length>1){L.polyline(geo.map(s=>[s.la,s.lo]),{color:col,weight:2,dashArray:'5,6',opacity:.7}).addTo(layer);}
 if(day===0){html+=cfg.notes.map(n=>`<div class="note">${n}</div>`).join('');}
 const sidebar=document.getElementById('sidebar');sidebar.innerHTML=html;sidebar.scrollTop=0;
 map.invalidateSize({pan:false});
 if(geo.length){const b=L.latLngBounds(geo.map(s=>[s.la,s.lo]));map.fitBounds(b,{paddingTopLeft:options?[65,85]:[30,80],paddingBottomRight:options?[65,85]:[30,30],maxZoom:options?16:14,animate:false});}
 else{map.setView(cfg.center,cfg.zoom,{animate:false});}
 arrangeOptionLabels();
}

window.onload=()=>{renderTabs();setTimeout(()=>{map.invalidateSize();render();},200);};
</script>
