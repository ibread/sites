   const frameIds=activeTab==='hotels'?hotelIds:overviewExtent==='all'?ids:[...anchorIds.filter(id=>id!=='mutianyu'),...hotelIds,'lama-temple'];
   leafletMap.fitBounds(frameIds.map(id=>[places[id].lat,places[id].lng]),{paddingTopLeft:[22,42],paddingBottomRight:[22,48],maxZoom:14,animate:false});
   $('mapNote').textContent=activeTab==='hotels'?tr('H1–H5: hotels · Tap a pin for details. Approximate building locations. Google shows one selected place.','H1–H5：酒店 · 点标记看详情。建筑近似定位；Google每次显示一个地点。'):tr('Purple H1–H5: hotels · City view by default; All stops includes Great Wall, Summer Palace & 798. Google: one place.','紫色H1–H5：酒店 · 默认市区视图；「全部地点」含长城、颐和园、798。Google仅单点。');
  }else if(Number.isFinite(p.lat)){
   leafletMap.setView([p.lat,p.lng],p.zoom);
   $('mapNote').textContent=tr('Approximate location for orientation, not turn-by-turn navigation.','近似方位示意，不作为逐步导航。');
  }else{
   leafletMap.setView([39.9042,116.4074],p.id==='terracotta'?4:11);
   $('mapNote').textContent=tr('Overview only; this venue’s pin is not verified. Use Open map to search.','仅示意底图；此场馆坐标未核定，请点「打开地图」搜索。');
  }
  requestAnimationFrame(()=>leafletMap.invalidateSize());
 }
}
function renderAll(){
 document.documentElement.lang=lang==='zh'?'zh-Hans':'en';document.title=tr('Beijing Winter Itinerary | Planning Draft','北京冬季行程 | 规划草稿');
 $('hdr-title').textContent=tr('Beijing in winter','北京冬季行程');$('hdr-sub').textContent=tr('Dec 19 (Sat)–24 (Thu), 2026 · Planning draft','2026/12/19（周六）–24（周四）· 规划草稿');$('homeLink').textContent=tr('🗺️ Trips','🗺️ 行程');$('langToggle').textContent=tr('中文','EN');$('langToggle').setAttribute('aria-label',tr('切换到中文','Switch to English'));
 renderTabs();renderSidebar();updateMap();if(detailId)renderDetail();
}
function toggleLang(){lang=lang==='en'?'zh':'en';const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);renderAll();}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)selectTab(b.dataset.tab);});
$('sidebar').addEventListener('click',e=>{if(e.target.closest('[data-candidates]')){const section=$('candidates'),sidebar=$('sidebar');sidebar.scrollTop+=section.getBoundingClientRect().top-sidebar.getBoundingClientRect().top;section.querySelector('[data-place]').focus({preventScroll:true});return;}const b=e.target.closest('[data-place],[data-tab]');if(!b)return;if(b.dataset.place)openPlace(b.dataset.place);else selectTab(b.dataset.tab);});
$('sidebar').addEventListener('change',e=>{const key=e.target.dataset.check;if(key)e.target.checked?checked.add(key):checked.delete(key);});
$('langToggle').onclick=toggleLang;$('detailLang').onclick=toggleLang;
$('googleBtn').onclick=()=>{provider='google';updateMap();};$('leafletBtn').onclick=()=>{provider='leaflet';updateMap();};
$('cityExtent').onclick=()=>{overviewExtent='city';updateMap();};$('allExtent').onclick=()=>{overviewExtent='all';updateMap();};
$('mapPlace').onclick=()=>openPlace(selectedPlace);
$('closeDetail').onclick=()=>$('placeDialog').close();
$('placeDialog').addEventListener('close',()=>{detailId=null;});
$('placeDialog').addEventListener('click',e=>{if(e.target===$('placeDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
window.addEventListener('resize',()=>{if(leafletMap)leafletMap.invalidateSize();});
renderAll();

</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" onload="if(provider==='leaflet') updateMap()" onerror="if(provider==='leaflet') mapError()"></script>
